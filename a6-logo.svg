<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="A6 logo">
  <title>A6</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#586377"/>
      <stop offset="0.55" stop-color="#2d3748"/>
      <stop offset="1" stop-color="#1a212e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d2f5"/>
      <stop offset="1" stop-color="#3b73bd"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="300" y1="350" x2="700" y2="670">
      <stop offset="0" stop-color="#8ad8ff"/>
      <stop offset="0.5" stop-color="#2f9bf0"/>
      <stop offset="1" stop-color="#1a63d6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <g transform="translate(512 512) scale(1.545) translate(-512 -512)">
    <!-- plate -->
    <rect x="222" y="222" width="580" height="580" rx="122" fill="url(#plate)"/>
    <rect x="226" y="226" width="572" height="572" rx="118" fill="none" stroke="url(#edge)" stroke-width="7"/>

    <!-- glow -->
    <path d="M302 646 L458 364 L506 562 C522 626 572 654 640 652 C700 649 722 604 718 560 C714 508 676 474 630 474 C594 474 567 498 563 520" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2f9bf0" stroke-width="40" opacity="0.38" filter="url(#glow)"/>
    <path d="M332 612 C398 592 452 572 498 530" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2f9bf0" stroke-width="40" opacity="0.38" filter="url(#glow)"/>
    <path d="M563 520 C556 452 586 386 652 360 C692 345 722 372 724 410" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2f9bf0" stroke-width="40" opacity="0.38" filter="url(#glow)"/>
    <!-- soft grey outline that gives the ribbon look -->
    <path d="M302 646 L458 364 L506 562 C522 626 572 654 640 652 C700 649 722 604 718 560 C714 508 676 474 630 474 C594 474 567 498 563 520" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#9db2c8" stroke-width="46" opacity="0.85"/>
    <path d="M332 612 C398 592 452 572 498 530" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#9db2c8" stroke-width="46" opacity="0.85"/>
    <path d="M563 520 C556 452 586 386 652 360 C692 345 722 372 724 410" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#9db2c8" stroke-width="46" opacity="0.85"/>
    <!-- blue ribbon -->
    <path d="M302 646 L458 364 L506 562 C522 626 572 654 640 652 C700 649 722 604 718 560 C714 508 676 474 630 474 C594 474 567 498 563 520" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="url(#ink)" stroke-width="34"/>
    <path d="M332 612 C398 592 452 572 498 530" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="url(#ink)" stroke-width="34"/>
    <path d="M563 520 C556 452 586 386 652 360 C692 345 722 372 724 410" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="url(#ink)" stroke-width="34"/>
    <!-- thin highlight -->
    <path d="M302 646 L458 364 L506 562 C522 626 572 654 640 652 C700 649 722 604 718 560 C714 508 676 474 630 474 C594 474 567 498 563 520" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#d6f0ff" stroke-width="3" opacity="0.55" transform="translate(-6 -6)"/>
    <path d="M332 612 C398 592 452 572 498 530" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#d6f0ff" stroke-width="3" opacity="0.55" transform="translate(-6 -6)"/>
    <path d="M563 520 C556 452 586 386 652 360 C692 345 722 372 724 410" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#d6f0ff" stroke-width="3" opacity="0.55" transform="translate(-6 -6)"/>
